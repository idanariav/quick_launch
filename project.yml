name: QuickLaunch
options:
  bundleIdPrefix: com.idanariav
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # All non-UI code lives in this local package (see docs/ARCHITECTURE.md).
  QuickLaunchKit:
    path: Packages/QuickLaunchKit
  # Renders Markdown output (decision 0020).
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Stable signing identity so macOS privacy grants (Accessibility, Input
    # Monitoring) survive rebuilds. Ad-hoc signing would reset them every build.
    DEVELOPMENT_TEAM: RLUV35UZ26
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  QuickLaunch:
    type: application
    platform: macOS
    sources: [Sources/QuickLaunch]
    dependencies:
      - package: QuickLaunchKit
        product: QLAssembly
      - package: QuickLaunchKit
        product: QLCore
      - package: QuickLaunchKit
        product: QLPlatform
      - package: QuickLaunchKit
        product: QLModuleLauncher
      - package: QuickLaunchKit
        product: QLModulePreferences
      - package: MarkdownUI
    info:
      path: Sources/QuickLaunch/Info.plist
      properties:
        CFBundleDisplayName: QuickLaunch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true # menu bar only, no Dock icon
        # Shown when a command uses AppleScript (e.g. settings/toggle_dark_mode).
        NSAppleEventsUsageDescription: QuickLaunch uses System Events, Arc, Terminal and Ghostty to run commands such as toggling dark mode, switching Arc tabs or opening Claude Code in a terminal.
        # The Calendar plugin (decision 0024).
        NSCalendarsFullAccessUsageDescription: QuickLaunch reads your calendars to join meetings and list your agenda, and adds the events you create.
        # quicklaunch://run/<command id> links (decision 0016).
        CFBundleURLTypes:
          - CFBundleURLName: com.idanariav.quicklaunch
            CFBundleURLSchemes: [quicklaunch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idanariav.quicklaunch
        # Sandbox stays off: it blocks Accessibility APIs, event taps and spawning `claude`.
        ENABLE_APP_SANDBOX: NO

  QuickLaunchTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/QuickLaunchTests]
    dependencies:
      - target: QuickLaunch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idanariav.quicklaunch.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  QuickLaunch:
    build:
      targets:
        QuickLaunch: all
        QuickLaunchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [QuickLaunchTests]
